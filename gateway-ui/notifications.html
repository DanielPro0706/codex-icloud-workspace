<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iCloud 授权提醒</title><link rel="manifest" href="/__codex_gateway_v1__/manifest.webmanifest"><link rel="icon" href="/__codex_gateway_v1__/icon.svg"><meta name="theme-color" content="#1265e7"><meta name="apple-mobile-web-app-capable" content="yes"><style>body{margin:0;background:#f5f7fa;color:#17202d;font:16px/1.8 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:680px;margin:40px auto;padding:28px;background:white;border:1px solid #e7ebf0;border-radius:18px}h1{font-size:26px}a{color:#1265e7}button{padding:11px 16px;margin:6px 8px 6px 0;border:1px solid #d5ddeb;background:white;color:#1265e7;border-radius:9px;font:inherit;cursor:pointer}code{overflow-wrap:anywhere;color:#405063}p{color:#687585}.status{padding:12px;background:#f2f7ff;border-radius:10px}@media(max-width:740px){main{margin:18px;padding:22px}}</style></head><body><main><a href="/">← 文件夹选择</a><h1>iCloud 授权提醒</h1><p id="healthStatus" class="status">正在读取网关状态…</p><p>手机网页提醒：在 Safari 中将本页“添加到主屏幕”，从主屏幕打开后点“启用网页提醒”，允许系统通知。</p><button id="subscribePush">启用网页提醒</button><button id="testPush">发送测试提醒</button><button id="unsubscribePush">停用本设备提醒</button><p id="pushStatus" role="status"></p><p id="mailStatus">邮件提醒配置状态待检查。</p><h2>手机重新授权</h2><p>在手机 SSH 客户端连接 <code>icloud-gateway@gateway.example.ts.net:22</code>，运行 <code>icloud-reconnect</code>。首次使用需在手机生成密钥并登记公钥。Apple 密码和验证码只在自己的 SSH 终端输入。</p><p>服务器每15分钟检查一次。正常时保持安静，异常或恢复时才通知；Mac 可以关机。</p></main><script>(()=>{'use strict';const $=id=>document.getElementById(id);
const notificationBase='/__codex_gateway_v1__/';
async function notificationAPI(route,body){const options={credentials:'same-origin',cache:'no-store'};if(body!==undefined){options.method='POST';options.headers={'Content-Type':'application/json'};options.body=JSON.stringify(body)}const r=await fetch(notificationBase+route,options);if(!r.ok)throw new Error('提醒服务请求失败（'+r.status+'）');return r.json()}
async function notificationStatus(){try{const data=await notificationAPI('notifications/status');const labels={OK:'iCloud 连接检查正常',REAUTH_REQUIRED:'需要重新完成 Apple 授权',APPLE_WEB_ACCESS_DISABLED:'需要启用 Apple 网页数据访问并批准设备提示',REGION_INCOMPATIBLE:'网关地区配置需要检查',CHECK_FAILED:'iCloud 读取检查失败，原因待确认',NETWORK_TIMEOUT:'iCloud 连接检查超时'};const health=data.health;$('healthStatus').textContent=health?(labels[health.status]||'网关状态待检查')+' · '+new Date(health.checked_at).toLocaleString():'首次通知状态检查尚未完成';const mail=health&&health.mail;$('mailStatus').textContent=mail&&mail.status==='accepted'?'邮件提醒最近已交给邮件服务。':mail&&mail.status==='ready'?'邮件提醒已配置。':mail&&mail.status==='failed'?'邮件提醒发送失败，需要检查邮箱授权。':'邮件提醒尚未完成服务器授权。';if(data.last_push)$('pushStatus').textContent='上次推送：'+data.last_push.accepted_by_push_service+' 台设备已交给推送服务'+(data.last_push.failed?'，'+data.last_push.failed+' 台失败':'')+'。手机实际收到通知后才算验收完成。'}catch(e){$('healthStatus').textContent='暂时无法读取提醒状态'}}
function vapidBytes(value){const raw=atob(value.replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(raw,c=>c.charCodeAt(0))}
$('subscribePush').addEventListener('click',async()=>{const button=$('subscribePush');button.disabled=true;try{if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window))throw new Error('此浏览器不能订阅。iPhone/iPad 请从主屏幕打开添加的网页。');const permission=await Notification.requestPermission();if(permission!=='granted')throw new Error('尚未允许系统通知。');const config=await notificationAPI('notifications/config');const worker=await navigator.serviceWorker.register(notificationBase+'sw.js',{scope:'/'});await navigator.serviceWorker.ready;let subscription=await worker.pushManager.getSubscription();if(!subscription)subscription=await worker.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:vapidBytes(config.public_key)});const result=await notificationAPI('notifications/subscribe',{subscription:subscription.toJSON()});localStorage.setItem('icloud-push-id',result.id);$('pushStatus').textContent='本设备已登记。点“发送测试提醒”，确认设备是否收到。'}catch(e){$('pushStatus').textContent=e.message}finally{button.disabled=false}});
$('testPush').addEventListener('click',async()=>{const button=$('testPush');button.disabled=true;try{const r=await notificationAPI('notifications/test',{});$('pushStatus').textContent=r.queued?'正在推送测试提醒，请检查通知中心。':r.reason==='no subscribed devices'?'请先启用网页提醒。':'已有推送正在发送。';if(r.queued)setTimeout(notificationStatus,5000)}catch(e){$('pushStatus').textContent=e.message}finally{button.disabled=false}});
$('unsubscribePush').addEventListener('click',async()=>{try{const id=localStorage.getItem('icloud-push-id');if(id)await notificationAPI('notifications/unsubscribe',{id});const worker=await navigator.serviceWorker.getRegistration('/');const sub=worker&&await worker.pushManager.getSubscription();if(sub)await sub.unsubscribe();localStorage.removeItem('icloud-push-id');$('pushStatus').textContent='本设备网页提醒已停用。'}catch(e){$('pushStatus').textContent=e.message}});
notificationStatus();})();
</script></body></html>
